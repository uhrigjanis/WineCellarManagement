name: Firestore rules and cloud sync

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "emulator-tests/**"
      - "src/**"
      - "vite.config.js"
      - ".env.emulator"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules

      - name: Install Chromium for the end-to-end test
        run: npx playwright install --with-deps chromium

      - name: Cloud sync end-to-end test (emulators + Vite proxy + browser)
        run: npm run test:e2e
